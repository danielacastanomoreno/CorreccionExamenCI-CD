name: CI/CD Pipeline - Product Application

# ==============================================================================
# TALLER EVALUATIVO: AUTOMATIZACION CI/CD (INGENIERIA DE SOFTWARE V - ICESI)
# ==============================================================================
# Instrucciones:
# Complete este archivo configurando los eventos y los 4 jobs descritos en la guia
# y en la presentacion de clase:
#
#   Job 1: test-backend  (Pruebas unitarias Spring Boot + Subir Artefacto JAR)
#   Job 2: test-frontend (Linting TypeScript + Compilacion Vite de la SPA)
#   Job 3: build-docker  (Construccion Multi-Stage con Docker Buildx de API y Web)
#   Job 4: smoke-test    (Levantamiento con Docker Compose + Prueba cURL al API)
# ==============================================================================

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ----------------------------------------------------------------------------
  # JOB 1: VALIDACION Y PRUEBAS UNITARIAS BACKEND
  # ----------------------------------------------------------------------------
  # TODO: Configurar runner ubuntu-latest
  # TODO: actions/checkout@v4. YA
  # TODO: actions/setup-java@v4 (Java 17, distribution: 'temurin', cache: 'maven'). YA
  # TODO: Ejecutar `mvn clean package` en backend/
  # TODO: actions/upload-artifact@v4 (Subir backend/target/*.jar como 'backend-jar')
  test-backend:
    name: Backend Unit Tests & Package
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4
      - name: Configurar Java 17 Temurin
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: Probar
        run: cd backend/ && mvn clean package
      - name: Subir artefacto JAR
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 1
      - name: Descargar  artefacto JAR
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend/target/
      - name: Ejecutar pruebas unitarias
        run: cd backend/ && mvn clean test 

  # ----------------------------------------------------------------------------
  # JOB 2: VALIDACION Y COMPILACION FRONTEND
  # ----------------------------------------------------------------------------
  # TODO: Configurar runner ubuntu-latest
  # TODO: actions/checkout@v4. YA
  # TODO: actions/setup-node@v4 (Node 20, cache: 'npm') YA
  # TODO: Ejecutar `npm install`, `npm run lint` y `npm run build` en frontend/ YA
  test-frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version:   20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install & Run Lint
        run: |
          cd frontend
          npm install
          npm run lint
      - name: Build SPA Bundle
        run: cd frontend && npm run build


  # ----------------------------------------------------------------------------
  # JOB 3: CONSTRUCCION DE IMAGENES DOCKER (MULTI-STAGE)
  # ----------------------------------------------------------------------------
  # TODO: Declarar dependencias: needs: [test-backend, test-frontend]
  # TODO: docker/setup-buildx-action@v3
  # TODO: docker/build-push-action@v5 para backend (context: ./backend)
  # TODO: docker/build-push-action@v5 para frontend (context: ./frontend)
  build-docker:
    name: Build Multi-Stage Docker Images
    needs: [ test-backend, test-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: product-api:latest
      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context:  ./frontend
          push: false
          tags: product-frontend:latest


  # ----------------------------------------------------------------------------
  # JOB 4: DESPLIEGUE LOCAL Y PRUEBA DE HUMO (SMOKE TEST)
  # ----------------------------------------------------------------------------
  # TODO: Declarar dependencias: needs: [build-docker]
  # TODO: Levantar stack con `docker compose up -d --build`
  # TODO: Esperar disponibilidad y validar con `curl http://localhost:8080/api/products` (HTTP 200)
  # TODO: Apagar contenedores con `docker compose down`
  smoke-test:
    name: Compose Up & Smoke Testing
    needs: [ build-docker]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Start Stack with Docker Compose
        run: |
                  echo "Construyendo y levantando contenedor Docker..."
                  docker compose build --no-cache
                  docker compose up -d --force-recreate
                  echo "Contenedor iniciado exitosamente"
      - name: Wait for Backend Healthcheck
        run: sleep 20
      - name: Execute Smoke Test (cURL API)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/products)
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" -ne 200  ]; then exit 1; fi
      - name: Stop Containers
        run: docker compose down
